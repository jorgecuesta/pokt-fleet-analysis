name: Collect 30 days for the eight reviewed services

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: 'Exclusive UTC end date (YYYY-MM-DD); blank uses the latest mature window'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pocket-monthly-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify collector offline
        run: python -m unittest discover -s tests -p test_collector.py -v
      - name: Collect the fixed sampling frame
        env:
          POCKET_END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          command = [sys.executable, "collector/run_month.py", "--out", "pokt-live-cache", "--product-output", "monthly-output/live-snapshot.json.gz"]
          end = os.environ.get("POCKET_END_DATE", "").strip()
          if end:
              command += ["--end", end]
          subprocess.run(command, check=True)
          PY
      - name: Retain collected evidence and incomplete work
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocket-month-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            monthly-output/
            pokt-live-cache/
            !pokt-live-cache/**/*.tmp
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
